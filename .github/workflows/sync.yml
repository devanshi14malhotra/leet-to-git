name: Sync LeetCode submissions

on:
  schedule:
    # Runs every 15 minutes. GitHub Actions cron is best-effort, not exact.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can push commits back to this repo

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      COMMIT_AUTHOR_NAME: ${{ vars.COMMIT_AUTHOR_NAME || 'Devanshi Malhotra' }}
      COMMIT_AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL || 'malhotra.dm07@gmail.com' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync script
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/sync.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "${COMMIT_AUTHOR_NAME}"
          git config user.email "${COMMIT_AUTHOR_EMAIL}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync accepted LeetCode submissions"
            git push
          fi
