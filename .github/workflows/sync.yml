name: Sync LeetCode submissions

on:
  schedule:
    # Poll every 5 minutes so recent accepted submissions are picked up quickly.
    # GitHub cron is best-effort, not exact, but this is much closer to real-time.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can push commits back to this repo

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      COMMIT_AUTHOR_NAME: ${{ vars.COMMIT_AUTHOR_NAME || 'Devanshi Malhotra' }}
      COMMIT_AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL || 'malhotra.dm07@gmail.com' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "${COMMIT_AUTHOR_NAME}"
          git config user.email "${COMMIT_AUTHOR_EMAIL}"

      - name: Run sync script
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/sync.py

      - name: Push commits if anything changed
        run: |
          git push
